name: Build web

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build/publish (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"

      - run: touch env-config.js

      - run: sudo npm install -g npm@11.14.0

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Create tarball
        run: tar -czvf trmm-web-${{ env.RELEASE_TAG }}.tar.gz dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: trmm-web-${{ env.RELEASE_TAG }}.tar.gz
